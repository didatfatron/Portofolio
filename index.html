<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page - Didat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Hilangkan margin dan padding default body */
    body, html {
      margin: 0;
      padding: 0;
    }

    /* Background gambar kontur */
    .hero-bg {
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      min-height: 100vh; /* pastikan fullscreen */
    }

    /* Overlay gelap agar teks kontras */
    .hero-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: rgba(0,0,0,0.6);
    }

    .hero-content {
      position: relative; /* agar di atas overlay */
      z-index: 10;
    }
  </style>
</head>
<body class="font-sans bg-gray-100 text-gray-900">

  <!-- Navbar -->
  <nav class="bg-gray-900 p-4 fixed w-full top-0 z-20">
    
  </nav>

  <!-- Hero Section -->
  <section class="flex flex-col justify-center items-center text-center hero-bg text-white pt-20">
    <div class="hero-content px-4">
      <h2 class="text-4xl font-bold mb-4 text-gray-150">Halo!, Selamat Datang</h2>
      <p class="text-lg max-w-xl text-gray-200 mb-10">
        Selamat datang di landing page saya! Untuk mengenal lebih lanjut, silakan klik untuk menuju portofolio.
      </p>
      <a href="portofolio.html" 
         class="px-8 py-3 bg-gray-200 text-black font-semibold rounded-lg shadow hover:bg-gray-300 transition duration-300">
        Lihat Portofolio
      </a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white p-6 text-center">
    <p>© 2025 Didat.</p>
  </footer>

</body>
</html>
